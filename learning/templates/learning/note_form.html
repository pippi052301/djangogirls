{% extends 'base.html' %}

{% block title %}Make new note{% endblock %}

{% block content %}
<h2>Enter the note content</h2>

<form method="post" action="{% url 'learning:create_note' %}">
    {% csrf_token %}
    
    <!-- Render toàn bộ Form (bao gồm cả title và content) do views.py truyền sang -->
    {{ form.as_p }}

    <button type="submit" class="btn-submit">Create exercise</button>
</form>
{% endblock %}
