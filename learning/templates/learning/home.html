{% extends 'base.html' %}

<!-- Hide Navbar-->
{% block content %}
<div class="hero-fullscreen">
    <canvas id="antigravity-canvas"></canvas>
    
    <div class="hero-content">
        <h1>Welcome to Study Support</h1>
        <p>Interactive platform for modern learning</p>
        {% if user.is_authenticated %}
            <!-- logged in -> to Notes page -->
            <a href="{% url 'notes:note_list' %}" class="btn-hero">To my personal study space</a>
        {% else %}
            <!-- not logged in -> to login page -->
            <a href="{% url 'accounts:login' %}" class="btn-hero">Getting Started</a>
        {% endif %}
    </div>
</div>

<style>

.navbar-header, .site-footer {
    display: none !important;
}


.hero-fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: linear-gradient(135deg, #0d1b2a, #1b263b);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999; 
}

#antigravity-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    color: #ffffff;
}

.hero-content h1 {
    font-size: 3.5rem;
    margin-bottom: 15px;
    text-shadow: 0 0 20px rgba(0, 255, 150, 0.5);
    font-weight: 700;
}

.hero-content p {
    font-size: 1.3rem;
    color: #e0e0e0;
    margin-bottom: 30px;
}

.btn-hero {
    display: inline-block;
    padding: 14px 36px;
    background: #2e7d32;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-weight: bold;
    font-size: 1.1rem;
    box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4);
    transition: all 0.3s ease;
}

.btn-hero:hover {
    background: #388e3c;
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(46, 125, 50, 0.7);
}
</style>

<script>
const canvas = document.getElementById('antigravity-canvas');
const ctx = canvas.getContext('2d');

let width, height;
let particles = [];

function initCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    particles = [];
    
    for (let i = 0; i < 90; i++) {
        particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 1.5,
            vy: (Math.random() - 0.5) * 1.5,
            radius: Math.random() * 3 + 1,
            color: '#4caf50'
        });
    }
}

function animate() {
    ctx.clearRect(0, 0, width, height);

    for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.x < 0 || p.x > width) p.vx *= -1;
        if (p.y < 0 || p.y > height) p.vy *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();

        for (let j = i + 1; j < particles.length; j++) {
            let p2 = particles[j];
            let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 120) {
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(76, 175, 80, ${1 - dist / 120})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(animate);
}

window.addEventListener('resize', initCanvas);
initCanvas();
animate();
</script>
{% endblock %}
