{% extends 'base_clean.html' %}

{% block title %}Tag: {{ tag.name }}{% endblock %}

{% block content %}
<div class="p-4 max-w-md mx-auto space-y-4">
    <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-700">
        <div class="flex items-center gap-2">
            <span class="inline-block px-2 py-0.5 text-xs rounded border border-blue-200 dark:border-blue-800 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-300 font-medium">
                # {{ tag.name }}
            </span>
        </div>
        <a href="{% url 'notes:tag_list' %}" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            Back to list
        </a>
    </div>

    <div class="space-y-2">
        <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Associated Notes</h4>
        <div class="divide-y divide-slate-100 dark:divide-slate-800">
            {% for note in notes %}
            <a href="{% url 'notes:note_detail' pk=note.pk %}" target="_top" class="block py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:text-blue-600 dark:hover:text-blue-400 transition">
                📝 {{ note.title }}
            </a>
            {% empty %}
            <p class="text-xs text-slate-400 italic py-4">No notes assigned to this tag.</p>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
