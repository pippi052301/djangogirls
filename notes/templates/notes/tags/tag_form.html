{% extends 'base_clean.html' %}

{% block title %}{% if object %}Edit Tag{% else %}Create Tag{% endif %}{% endblock %}

{% block content %}
<div class="p-4 max-w-md mx-auto space-y-4">
    <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-700">
        <h2 class="text-sm font-semibold text-slate-800 dark:text-slate-100">
            {% if object %}Edit Tag{% else %}Create New Tag{% endif %}
        </h2>
        <a href="{% url 'notes:tag_list' %}" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            Back to list
        </a>
    </div>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Tag Name</label>
            <input type="text" name="name" value="{{ form.name.value|default:'' }}" required placeholder="Enter tag name..." class="w-full px-3 py-1.5 text-xs border border-slate-200 dark:border-slate-700 rounded bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-blue-500">
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
            <a href="{% url 'notes:tag_list' %}" class="px-3 py-1.5 text-xs text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded transition">
                Cancel
            </a>
            <button type="submit" class="px-3.5 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white font-medium rounded transition">
                Save
            </button>
        </div>
    </form>
</div>
{% endblock %}
