{% extends 'base_clean.html' %}

{% block title %}Manage Tags{% endblock %}

{% block content %}
<div class="p-4 space-y-4 max-w-md mx-auto select-none">
    <!-- Header/Quick Create -->
    <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-700">
        <div class="flex items-center gap-2">
            <i data-lucide="tags" class="w-4 h-4 text-blue-600 dark:text-blue-400"></i>
            <h2 class="text-xs font-bold text-slate-800 dark:text-slate-100 uppercase tracking-wider">
                Tag Storage
            </h2>
        </div>
        <a href="{% url 'notes:tag_create' %}" class="inline-flex items-center gap-1 text-xs bg-blue-600 hover:bg-blue-700 text-white font-medium px-2.5 py-1 rounded transition">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>New Tag</span>
        </a>
    </div>

    <!-- List of Tags -->
    <div class="space-y-2">
        {% for tag in tags %}
        <div class="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-800/60 rounded-lg border border-slate-200 dark:border-slate-700/60 hover:border-blue-300 dark:hover:border-blue-600 transition group">
            <a href="{% url 'notes:tag_detail' pk=tag.pk %}" class="inline-block {{ tag.color_class }} border text-xs px-2.5 py-0.5 rounded font-medium transition hover:scale-105">
                # {{ tag.name }}
            </a>
            
            <div class="flex items-center gap-1.5 opacity-80 group-hover:opacity-100 transition">
                <a href="{% url 'notes:tag_update' pk=tag.pk %}" class="p-1.5 text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 hover:bg-slate-200/50 dark:hover:bg-slate-700/50 rounded transition" title="Edit tag">
                    <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                </a>
                
                <!-- Quick Delete Form with JS Confirm -->
                <form method="POST" action="{% url 'notes:tag_delete' pk=tag.pk %}" onsubmit="return confirm('Are you sure you want to delete tag &quot;{{ tag.name }}&quot;?');" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="p-1.5 text-slate-400 hover:text-red-600 dark:hover:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 rounded transition" title="Delete tag">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                </form>
            </div>
        </div>
        {% empty %}
        <div class="text-center py-8 text-xs text-slate-400 italic">
            No tags available in storage.
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
