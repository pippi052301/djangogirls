{% extends 'base_notes.html' %}

{% block title %}Delete Folder - {{ folder.name }}{% endblock %}

{% block content %}
<div class="p-4 max-w-md mx-auto space-y-4">
    <div class="p-5 bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-900/50 rounded-xl space-y-4">
        <div class="flex items-center gap-3 text-red-600 dark:text-red-400">
            <i data-lucide="alert-triangle" class="w-6 h-6 shrink-0"></i>
            <h3 class="text-sm font-semibold">Confirm Folder Deletion</h3>
        </div>
        
        <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
            Are you sure you want to delete folder <strong class="text-slate-900 dark:text-white">"{{ folder.name }}"</strong>? This action cannot be undone.
        </p>

        <form method="POST" class="flex items-center justify-end gap-2 pt-2 border-t border-red-100 dark:border-red-900/30">
            {% csrf_token %}
            <a href="{% url 'notes:folder_list' %}" class="px-3.5 py-1.5 text-xs text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded transition font-medium">
                Cancel
            </a>
            <button type="submit" class="px-4 py-1.5 text-xs bg-red-600 hover:bg-red-700 text-white font-medium rounded transition">
                Delete Folder
            </button>
        </form>
    </div>
</div>
{% endblock %}
