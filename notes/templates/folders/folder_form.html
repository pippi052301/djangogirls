{% extends 'base_notes.html' %}

{% block title %}{% if folder %}Edit Folder - {{ folder.name }}{% else %}Create Folder{% endif %}{% endblock %}

{% block content %}
<div class="p-4 max-w-md mx-auto space-y-4">
    <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-700">
        <h2 class="text-sm font-semibold text-slate-800 dark:text-slate-100">
            {% if folder %}Edit Folder{% else %}Create New Folder{% endif %}
        </h2>
        <a href="{% url 'notes:folder_list' %}" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            Back to Library
        </a>
    </div>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Folder Name</label>
            <input type="text" name="name" value="{{ form.name.value|default:folder.name|default:'' }}" required placeholder="Enter folder name..." class="w-full px-3 py-1.5 text-xs border border-slate-200 dark:border-slate-700 rounded bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-blue-500">
        </div>

        <div>
            <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Parent Folder (Optional)</label>
            <div class="relative">
                <select name="parent" class="w-full pl-3 pr-9 py-1.5 text-xs border border-slate-200 dark:border-slate-700 rounded bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:border-blue-500 appearance-none cursor-pointer">
                    <option value="">None (Root level)</option>
                    {% for field_choice in form.parent.field.queryset %}
                        {% if folder and field_choice.pk == folder.pk %}
                        {% else %}
                            <option value="{{ field_choice.pk }}" {% if form.parent.value == field_choice.pk or folder.parent_id == field_choice.pk %}selected{% endif %}>
                                {{ field_choice.name }}
                            </option>
                        {% endif %}
                    {% endfor %}
                </select>
                <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                    <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
            <a href="{% url 'notes:folder_list' %}" class="px-3 py-1.5 text-xs text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded transition">
                Cancel
            </a>
            <button type="submit" class="px-3.5 py-1.5 text-xs bg-blue-600 hover:bg-blue-700 text-white font-medium rounded transition">
                Save
            </button>
        </div>
    </form>
</div>
{% endblock %}
